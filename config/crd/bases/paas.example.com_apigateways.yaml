                        Gateway.
                      type: string
                    port:
                      description: port the listener binds to.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    protocol:
                      default: HTTP
                      description: protocol the listener speaks.
                      enum:
                      - HTTP
                      - HTTPS
                      - TLS
                      - TCP
                      - UDP
                      type: string
                    tlsSecretName:
                      description: |-
                        tlsSecretName is the name of a same-namespace Secret (type
                        kubernetes.io/tls) providing the certificate for this listener.
                        Required when protocol is "HTTPS" or "TLS"; invalid otherwise.

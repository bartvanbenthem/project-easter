  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: apigateways.paas.example.com
spec:
  group: paas.example.com
  names:
    kind: APIGateway
    listKind: APIGatewayList
    plural: apigateways
    shortNames:
    - agw
    singular: apigateway
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.gatewayClassName
      name: Class
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: APIGateway is the Schema for the apigateways API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of APIGateway
            properties:
              gatewayClassName:
                default: kgateway
                description: |-
                  gatewayClassName selects the Gateway API implementation that
                  provisions this Gateway. Defaults to "kgateway", the GatewayClass
                  name kgateway's own Helm chart creates.
                type: string
              listeners:
                description: |-
                  listeners are the network entry points exposed by this Gateway. At
                  least one is required.
                items:
                  description: GatewayListener is one network entry point on an APIGateway.
                  properties:
                    hostname:
                      description: hostname the listener matches on. Leave unset to

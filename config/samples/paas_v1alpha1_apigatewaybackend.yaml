apiVersion: paas.example.com/v1alpha1
kind: APIGatewayBackend
metadata:
  labels:
    app.kubernetes.io/name: paas-operator
    app.kubernetes.io/managed-by: kustomize
  name: example-other-cluster-svc
spec:
  # host can be anything reachable by network address: a Service on another
  # Kubernetes cluster, a VM, a managed service -- not just an in-cluster
  # Service (which a plain Gateway API HTTPRoute backendRef already covers
  # on its own, without needing this CRD).
  hosts:
    - host: svc.other-cluster.example.com
      port: 443
#
# Bind a path on the APIGateway above to this Backend with a plain Gateway
# API HTTPRoute -- routing rules aren't wrapped by this operator, the same
# way its other integrations leave routing/child config to the vendor's own
# objects.
#
# apiVersion: gateway.networking.k8s.io/v1
# kind: HTTPRoute
# metadata:
#   name: example-other-cluster-route
# spec:
#   parentRefs:
#     - name: example-gateway
#   rules:
#     - backendRefs:
#         - group: gateway.kgateway.dev
#           kind: Backend
#           name: example-other-cluster-svc

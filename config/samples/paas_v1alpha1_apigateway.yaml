apiVersion: paas.example.com/v1alpha1
kind: APIGateway
metadata:
  labels:
    app.kubernetes.io/name: paas-operator
    app.kubernetes.io/managed-by: kustomize
  name: example-gateway
spec:
  # gatewayClassName is optional; defaults to "kgateway", the GatewayClass
  # kgateway's own Helm chart creates.
  listeners:
    - name: http
      port: 80
      protocol: HTTP
